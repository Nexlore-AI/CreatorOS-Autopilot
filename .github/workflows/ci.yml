# What CI is for here: proving the acceptance criterion on every platform, and catching the
# classes of mistake this project has actually made — a module nobody imports, a secret in
# a config file, an OS-specific call outside runtime/.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy
      - name: secrets do not belong in config files
        run: |
          python scripts/check_no_secrets.py \
            creatoros.example.yaml \
            $(git ls-files 'examples/**/*.yaml' 'creatoros_autopilot/brands/*.yaml')

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs the history, not just the tip, or a key committed three
          # commits ago and removed in the fourth goes unnoticed.
          fetch-depth: 0

      # The gitleaks *binary* is MIT and free. The gitleaks *Action* requires a paid
      # licence for organization-owned repositories and fails with
      # "[Nexlore-AI] is an organization. License key is required." — so this runs the
      # tool directly. Same scan, no licence, one fewer third party in CI.
      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the full history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1

      - name: Scan the working tree
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --redact --exit-code 1

      # Pairs with the one allowlist in .gitleaks.toml, and is stricter than the rule it
      # replaces: every placeholder in the template must be empty, not merely
      # unrecognisable to a pattern.
      - name: The .env template contains no values
        run: python scripts/check_no_secrets.py --template .env.example

  test:
    name: ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      # The environment is deliberately bare: no key is set, so anything that quietly
      # depended on one fails here rather than in a user's first five minutes.
      - name: Tests
        run: pytest -q

      - name: Doctor
        run: creatoros doctor

      - name: Render an example with no API keys
        run: creatoros render examples/specs/kv-cache.json -o kv-cache.mp4

      - name: Check the render is a real video
        shell: bash
        run: |
          ffprobe -v error -show_entries format=duration -of csv=p=0 kv-cache.mp4
          test -s kv-cache.mp4

      - name: First-run path — init, doctor, render, from an empty directory
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fresh" && cd "$RUNNER_TEMP/fresh"
          creatoros init --yes
          creatoros doctor
          cp "$GITHUB_WORKSPACE/examples/specs/kv-cache.json" .
          creatoros render kv-cache.json -o first.mp4
          test -s first.mp4
