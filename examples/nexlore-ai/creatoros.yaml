# The Nexlore AI preset — the configuration that runs
# https://www.youtube.com/@NexloreAI/shorts and https://instagram.com/nexloreai
#
# This is an example of a real channel's settings, not the defaults. Note how much of what
# used to be hard-coded is now just data: the slot times, the offset, the voice, the
# category. The brand itself — the wordmark, palette, fonts and the Hinglish language mix
# — is still inside the renderer and the prompts; pulling it out into a brand kit is
# Phase 3.
#
# Copy it, change what differs for you, and keep your keys in .env.

workspace: ""              # set this to where your renders should live

timezone: Asia/Kolkata

style: nexlore-v3
# The wordmark, palette, fonts and the Hinglish language mix — all of which used to be
# welded into the renderer and the prompts. `creatoros brands` lists what is available.
brand: nexlore-ai

content:
  videos_per_day: 4
  run_at: "06:30"
  pillars_dir: pillars

agent:
  provider: claude_code
  max_turns: 240           # 4 videos a run

tts:
  backend: elevenlabs
  voice_id: ZI6I4a3UGgs1DXxqWjBV      # Riya Rao (Hindi)
  model: eleven_multilingual_v2

music:
  mode: library

publish:
  # The live channel runs `auto`. Every other preset ships `draft`.
  mode: auto
  platforms: [instagram, youtube]     # the same MP4 to both, at the same slot
  # Pinned deliberately. Without this, routing prefers a backend that needs no
  # third-party account and would send this channel's videos to the direct YouTube and
  # Instagram APIs — which are not configured here — instead of Zernio. One upload to
  # Zernio also serves both platforms, which two direct backends cannot do.
  backends: [zernio]
  # Rendering four videos takes about six hours, so they are scheduled onto the NEXT day's
  # slots and never race the clock. The pipeline therefore always holds a day of stock,
  # and a slow run does not leave a gap.
  offset_days: 1
  post_times: ["09:00", "13:00", "18:00", "21:00"]
  youtube:
    visibility: public
    category_id: "28"

# The language-mix gate reads the brand's `language` block: Hindi grammar, ~45% English
# vocabulary, Devanagari script. It was a lexicon and a hard 38-55% band compiled into the
# pipeline; a channel in one language now simply has nothing for it to measure.
gates: [langmix]
